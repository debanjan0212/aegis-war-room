[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-war-room"
version = "0.1.0"
description = "An AI incident war room: agents investigate, a defender checks the fix, and a human gives go / no-go."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "langgraph>=1.0,<2",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "bandit>=1.8",
    "pip-audit>=2.9",
]

[project.optional-dependencies]
# Only needed for a model on your own laptop (Ollama).
local = [
    "langchain>=1.0,<2",
    "langchain-ollama>=1.0",
]
# Every model the toggle knows: the three clouds, and the local one.
cloud = [
    "langchain>=1.0,<2",
    "langchain-openai>=1.0",
    "langchain-aws>=1.0",
    "langchain-google-vertexai>=3.0",
    "langchain-ollama>=1.0",
]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
aegis = "aegis.cli:main"

[tool.setuptools.packages.find]
include = ["aegis*"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]

[tool.ruff.lint.per-file-ignores]
"aegis/agents/scribe.py" = ["E501"]  # message templates read better on one line

[tool.pytest.ini_options]
testpaths = ["tests"]
